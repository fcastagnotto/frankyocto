require conf/machine/raspberrypi.conf

MACHINEOVERRIDES =. "raspberrypi-bb8:"

# allinea upstream kernel
KERNEL_IMAGETYPE = "uImage"
UBOOT_ENTRYPOINT = "0x00008000"
UBOOT_LOADADDRESS = "0x00008000"
KERNEL_EXTRA_ARGS += "LOADADDR=${UBOOT_ENTRYPOINT}"

# allinea meta-raspberrypi boot logic
KERNEL_DEVICETREE = "broadcom/bcm2835-rpi-b.dtb"
RPI_KERNEL_DEVICETREE = "bcm2835-rpi-b.dtb"
